<html lang="en"><head><meta charset="utf-8">

<title>DoorLine Admin</title>

<meta name="apple-mobile-web-app-title" content="DoorLine">
<style>
:root{--bg:#f1f2f4;--card:#fff;--tx:#1a1a1a;--mut:#6b7280;--bd:#e1e4e8;--dg:#c62828;--ok:#2e7d32;--ac:#ff5a0a;--ac2:#1a1a1a;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--card:#1a1d21;--tx:#eceff3;--mut:#9aa3af;--bd:#2b3036;--dg:#ff6b6b;--ok:#66bb6a}}
:root[data-theme="dark"]{--bg:#0f1114;--card:#1a1d21;--tx:#eceff3;--mut:#9aa3af;--bd:#2b3036;--dg:#ff6b6b;--ok:#66bb6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--ac);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;justify-content:space-between}
.top img{height:46px;display:block}.top .t{font-size:13px;color:#555;text-align:right;line-height:1.3}
.top .t b{display:block;color:#1a1a1a;font-size:15px}
main{max-width:600px;margin:auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom,0px))}
h2{font-size:16px;margin:0 0 8px}h3{font-size:14px;margin:0 0 6px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
input[type=color]{padding:2px;height:44px}
button{width:auto;cursor:pointer;background:var(--card)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
button.d{color:var(--dg);border-color:var(--dg)}
button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.r{display:flex;gap:8px;align-items:center;margin-bottom:8px}.r>*{flex:1}.r>button{flex:none}
.m{color:var(--mut);font-size:13px}.tot{font-size:22px;font-weight:800;text-align:right}
.line{border-top:1px solid var(--bd);padding:8px 0}.n{width:84px!important;flex:none!important}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--ac);border-radius:12px;padding:10px}
.k b{font-size:19px;display:block;margin-top:2px}.k span{font-size:12px;color:var(--mut)}
.bad{color:var(--dg);font-weight:700}.good{color:var(--ok);font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--bd);padding-top:6px}
.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.lbl{display:flex;gap:3px;margin-top:4px}.lbl span{flex:1;text-align:center;font-size:9px;color:var(--mut);overflow:hidden}
.bar2{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar2 i{display:block;height:100%;background:var(--ac)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ac2);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ac)}
.nav button{flex:1;background:none;border:0;color:#b9bec6;font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ac);font-weight:700}
.nav .fab{flex:none;width:62px;height:62px;border-radius:50%;background:var(--ac);color:#fff;margin:-30px 6px 0;border:4px solid var(--ac2);justify-content:center}
.nav .fab.on{color:#fff}
.mn button{display:block;width:100%;text-align:left;margin-bottom:8px;font-weight:600}
</style></head><body>

<main id="v"></main>
<div class="nav" id="nav"></div>

S.bills.forEach(function(b){if(b.iso==td)a+=b.t;if((b.iso||"").slice(0,7)==mo)m+=b.t;pd+=pend(b)});
return '<div class="g"><div class="k"><span>Today sales</span><b>Rs '+f(a)+'</b></div><div class="k"><span>This month</span><b>Rs '+f(m)+'</b></div><div class="k"><span>Total bills</span><b>'+S.bills.length+'</b></div><div class="k"><span>Pending payments</span><b class="'+(pd>0?"bad":"")+'">Rs '+f(pd)+'</b></div></div>'+
'<div class="r"><button class="p" onclick="tab(\'bill\')">+ New Bill</button><button onclick="tab(\'items\')">Add Product</button><button onclick="tab(\'custs\')">Add Customer</button></div>'+
'<div class="card"><h2>Recent bills</h2>'+(S.bills.length?S.bills.slice(0,5).map(function(b){return '<div class="r"><span>#'+b.no+' '+esc(b.cn||b.p)+'<br><span class="m">'+b.d+'</span></span><b style="text-align:right">Rs '+f(b.t)+'</b></div>'}).join(""):'<span class="m">No bills yet</span>')+'</div>'}
function vBill(){
var co='<option value="">-- Select customer --</option>'+S.custs.map(function(c,i){return '<option value="'+i+'"'+(CID===String(i)?" selected":"")+'>'+esc(c.n)+' ('+esc(c.p)+')</option>'}).join("");
var io=S.items.map(function(x,i){return '<option value="'+i+'">'+esc(x.n)+' - Rs '+f(x.r)+'/'+esc(x.u)+'</option>'}).join("");
var ls=L.map(function(l,i){return '<div class="line"><b>'+esc(l.n)+'</b><div class="r" style="margin-top:6px"><input class="n" type="number" inputmode="decimal" value="'+l.q+'" onchange="L['+i+'].q=+this.value||0;draw()"><span class="m">'+esc(l.u)+' x Rs</span><input class="n" type="number" inputmode="decimal" value="'+l.r+'" onchange="L['+i+'].r=+this.value||0;draw()"><b>'+f(l.q*l.r)+'</b><button class="d" onclick="L.splice('+i+',1);draw()">X</button></div></div>'}).join("");
var s=sub(),t=Math.max(0,s-DISC);
var pm=[["full","Fully paid"],["part","Part paid"],["none","Not paid"]].map(function(x){return '<button class="'+(PAY==x[0]?"on":"")+'" onclick="PAY=\''+x[0]+'\';draw()">'+x[1]+'</button>'}).join("");
return '<div class="card"><h2>Customer</h2><select onchange="CID=this.value;if(CID!==\'\')PH=S.custs[CID].p;draw()">'+co+'</select><div class="r" style="margin-top:8px"><input type="tel" placeholder="Or type number: 03xx..." value="'+esc(PH)+'" oninput="PH=this.value"></div></div>'+
'<div class="card"><h2>Add product</h2><select id="si">'+io+'</select><div class="r" style="margin-top:8px"><input id="sq" type="number" inputmode="decimal" placeholder="Qty" value="1"><button class="p" onclick="addL()">+ Add</button></div>'+ls+'</div>'+
'<div class="card"><div class="r"><span>Subtotal</span><b style="text-align:right">Rs '+f(s)+'</b></div><div class="r"><span>Discount</span><input type="number" inputmode="decimal" value="'+(DISC||"")+'" onchange="DISC=+this.value||0;draw()"></div><div class="tot">Total: Rs '+f(t)+'</div></div>'+
'<div class="card"><h2>Payment</h2><div class="seg">'+pm+'</div>'+(PAY=="part"?'<input type="number" inputmode="decimal" placeholder="Amount received now (Rs)" value="'+esc(RCV)+'" oninput="RCV=this.value"><p class="m">Remaining amount will be saved as Due.</p>':'')+'</div>'+
'<div class="r"><button class="p" onclick="send(\'sms\')">Save + SMS</button><button onclick="send(\'wa\')">Save + WhatsApp</button></div>';}
function addL(){var x=S.items[+$("si").value];if(!x)return;L.push({n:x.n,u:x.u,r:x.r,q:+$("sq").value||1});draw()}
function digits(p){var d=String(p).replace(/\D/g,"");if(d.indexOf("0")==0)d="92"+d.slice(1);return d}
function msg(b){var m=C.name+" - "+C.loc+"\nBill #"+b.no+" - "+b.d+"\n"+(b.cn?"Customer: "+b.cn+"\n":"")+"\n";
b.l.forEach(function(l){m+=l.n+": "+l.q+" "+l.u+" x "+f(l.r)+" = "+f(l.q*l.r)+"\n"});
m+="\nSubtotal: Rs "+f(b.s)+"\n";if(b.disc)m+="Discount: Rs "+f(b.disc)+"\n";m+="TOTAL: Rs "+f(b.t)+"\n";
if(pend(b)>0)m+="Received: Rs "+f(paidOf(b))+"\nBALANCE DUE: Rs "+f(pend(b))+"\n";return m+"Contact: "+C.phone+"\nThank you!"}
function open2(b,k){if(!b.p){alert("Enter a number");return}
location.href=k=="sms"?"sms:"+b.p.replace(/\s/g,"")+"?body="+encodeURIComponent(msg(b)):"https://wa.me/"+digits(b.p)+"?text="+encodeURIComponent(msg(b))}
function send(k){if(!L.length){alert("Add products first");return}if(!PH){alert("Select customer or type a number");return}
var s=sub(),t=Math.max(0,s-DISC),c=CID!==""?S.custs[CID]:null,pd=PAY=="full"?t:PAY=="none"?0:Math.min(t,+RCV||0);
var b={no:S.n++,d:new Date().toLocaleDateString("en-GB"),iso:today(),cn:c?c.n:"",p:PH,l:L,s:s,disc:DISC,t:t,paid:pd};
S.bills.unshift(b);sv();L=[];DISC=0;CID="";PH="";RCV="";PAY="full";open2(b,k);draw()}
function vHist(){var qq=Q.toLowerCase(),h='<input placeholder="Search customer, number or bill #" value="'+esc(Q)+'" oninput="Q=this.value;hl()" style="margin-bottom:12px"><div id="hl">'+hlist()+'</div>';return h}
function hl(){$("hl").innerHTML=hlist()}
function hlist(){var qq=Q.toLowerCase(),n=0,h=S.bills.map(function(b,i){
if(qq&&((b.cn||"")+" "+b.p+" #"+b.no).toLowerCase().indexOf(qq)<0)return"";n++;var pe=pend(b);
return '<div class="card"><b>Bill #'+b.no+'</b> <span class="m">'+b.d+' - '+esc(b.cn||b.p)+'</span><div class="tot" style="text-align:left;font-size:18px">Rs '+f(b.t)+(pe>0?' <span class="bad" style="font-size:14px">Due Rs '+f(pe)+'</span>':' <span class="good" style="font-size:14px">Paid</span>')+'</div>'+
(pe>0?'<div class="r" style="margin-top:8px"><input id="pm'+i+'" type="number" inputmode="decimal" placeholder="Payment received"><button class="p" onclick="rcv('+i+')">Receive</button></div>':'')+
'<div class="r" style="margin-top:8px"><button onclick="open2(S.bills['+i+'],\'sms\')">SMS</button><button onclick="open2(S.bills['+i+'],\'wa\')">WhatsApp</button><button class="d" onclick="delB('+i+')">Delete</button></div></div>'}).join("");
return n?h:'<div class="card m">No bills found</div>'}
function rcv(i){var a=+$("pm"+i).value;if(!a)return;var b=S.bills[i];b.paid=Math.min(b.t,paidOf(b)+a);sv();draw()}
function delB(i){var b=S.bills[i];if(confirm("Delete Bill #"+b.no+" (Rs "+f(b.t)+")? This cannot be undone.")){S.bills.splice(i,1);sv();draw()}}
function vRev(){var now=new Date(),y=now.getFullYear(),mo=now.getMonth(),keys=[],lb=[];
if(RG=="7"){for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);keys.push(isoOf(d));lb.push(d.getDate())}}
else if(RG=="m"){var dn=new Date(y,mo+1,0).getDate();for(var j=1;j<=dn;j++){keys.push(y+"-"+p2(mo+1)+"-"+p2(j));lb.push(j)}}
else{for(var k=1;k<=12;k++){keys.push(y+"-"+p2(k));lb.push("JFMAMJJASOND".charAt(k-1))}}
var by={},tr=0,tp=0,td=0,cnt=0,pr={},cu={};
S.bills.forEach(function(b){var iso=b.iso||"";var key=RG=="y"?iso.slice(0,7):iso;if(keys.indexOf(key)<0)return;
by[key]=(by[key]||0)+b.t;tr+=b.t;tp+=paidOf(b);td+=b.disc||0;cnt++;
b.l.forEach(function(l){var o=pr[l.n]=pr[l.n]||{a:0,q:0,u:l.u};o.a+=l.q*l.r;o.q+=l.q});
var cn=b.cn||b.p;cu[cn]=(cu[cn]||0)+b.t});
var vals=keys.map(function(k){return by[k]||0}),mx=Math.max.apply(null,vals.concat([1]));
var bars='<div class="bars">'+vals.map(function(v){return '<div style="height:'+Math.round(v/mx*100)+'%"></div>'}).join("")+'</div><div class="lbl">'+lb.map(function(x){return '<span>'+x+'</span>'}).join("")+'</div>';
var pl=Object.keys(pr).sort(function(a,b){return pr[b].a-pr[a].a}).slice(0,6),pm=pl.length?pr[pl[0]].a:1;
var cl=Object.keys(cu).sort(function(a,b){return cu[b]-cu[a]}).slice(0,5);
var sg=[["7","7 Days"],["m","This Month"],["y","This Year"]].map(function(x){return '<button class="'+(RG==x[0]?"on":"")+'" onclick="RG=\''+x[0]+'\';draw()">'+x[1]+'</button>'}).join("");
return '<div class="seg">'+sg+'</div><div class="g"><div class="k"><span>Revenue</span><b>Rs '+f(tr)+'</b></div><div class="k"><span>Received</span><b class="good">Rs '+f(tp)+'</b></div><div class="k"><span>Pending</span><b class="'+(tr-tp>0?"bad":"")+'">Rs '+f(tr-tp)+'</b></div><div class="k"><span>Bills / Avg bill</span><b>'+cnt+' / Rs '+f(cnt?tr/cnt:0)+'</b></div></div>'+
'<div class="card"><h3>Sales chart</h3>'+bars+'</div>'+
'<div class="card"><h3>Top products (by revenue)</h3>'+(pl.length?pl.map(function(n){return '<div class="r" style="margin:0"><span>'+esc(n)+'</span><b style="text-align:right">Rs '+f(pr[n].a)+'</b></div><div class="m">Sold: '+f(pr[n].q)+' '+esc(pr[n].u)+'</div><div class="bar2"><i style="width:'+Math.round(pr[n].a/pm*100)+'%"></i></div>'}).join(""):'<span class="m">No sales in this period</span>')+'</div>'+
'<div class="card"><h3>Top customers</h3>'+(cl.length?cl.map(function(n){return '<div class="r"><span>'+esc(n)+'</span><b style="text-align:right">Rs '+f(cu[n])+'</b></div>'}).join(""):'<span class="m">No sales in this period</span>')+'</div>'+
'<p class="m">Discount given in this period: Rs '+f(td)+'</p>'}
function vMore(){return '<div class="mn"><button onclick="tab(\'items\')">Products and rates</button><button onclick="tab(\'custs\')">Customers</button><button onclick="tab(\'set\')">Settings, PIN and backup</button></div>'}
function vItems(){return '<div class="card"><h2>Add new product</h2><input id="in" placeholder="Product name"><div class="r" style="margin-top:8px"><input id="ir" type="number" inputmode="decimal" placeholder="Rate (Rs)"><input id="iu" placeholder="Unit (pc/kg/ft)" value="pc"></div><button class="p" onclick="addI()">Save product</button></div><div class="card"><h2>All products and rates</h2>'+S.items.map(function(x,i){return '<div class="line"><b>'+esc(x.n)+'</b><div class="r" style="margin-top:6px"><span class="m">Rs</span><input type="number" inputmode="decimal" value="'+x.r+'" onchange="S.items['+i+'].r=+this.value||0;sv()"><span class="m">/'+esc(x.u)+'</span><button class="d" onclick="if(confirm(\'Delete product?\')){S.items.splice('+i+',1);sv();draw()}">Delete</button></div></div>'}).join("")+'</div>'}
function addI(){var n=$("in").value.trim();if(!n)return;S.items.push({n:n,r:+$("ir").value||0,u:$("iu").value||"pc"});sv();draw()}
function vCusts(){var due={};S.bills.forEach(function(b){due[b.p]=(due[b.p]||0)+pend(b)});
return '<div class="card"><h2>Add new customer</h2><input id="cn" placeholder="Name"><div class="r" style="margin-top:8px"><input id="cp" type="tel" placeholder="Phone 03xx..."></div><button class="p" onclick="addC()">Save customer</button></div><div class="card">'+(S.custs.length?S.custs.map(function(c,i){var d=due[c.p]||0;return '<div class="r"><span>'+esc(c.n)+'<br><span class="m">'+esc(c.p)+'</span>'+(d>0?' <span class="bad" style="font-size:13px">Due Rs '+f(d)+'</span>':'')+'</span><button class="d" onclick="if(confirm(\'Delete customer?\')){S.custs.splice('+i+',1);sv();draw()}">Delete</button></div>'}).join(""):'<span class="m">No customers yet</span>')+'</div>'}
function addC(){var n=$("cn").value.trim(),p=$("cp").value.trim();if(!n||!p)return;S.custs.push({n:n,p:p});sv();draw()}
function vSet(){return '<div class="card"><h2>Business</h2><input value="'+esc(C.name)+'" onchange="C.name=this.value;sv()"><div class="r" style="margin-top:8px"><input value="'+esc(C.loc)+'" onchange="C.loc=this.value;sv();theme()"></div><input value="'+esc(C.phone)+'" onchange="C.phone=this.value;sv()"><p class="m">Name, city and phone are printed in the bill SMS.</p></div>'+
'<div class="card"><h2>Colours and logo</h2><div class="r"><span class="m">Main</span><input type="color" value="'+C.c1+'" onchange="C.c1=this.value;sv();theme()"><span class="m">Dark</span><input type="color" value="'+C.c2+'" onchange="C.c2=this.value;sv();theme()"></div><input type="file" accept="image/*" onchange="logo(this)"><p class="m">Optional: choose a different logo from the gallery.</p>'+(C.logo?'<button class="d" onclick="C.logo=\'\';sv();draw()">Use default DoorLine logo</button>':'')+'</div>'+
'<div class="card"><h2>Admin PIN</h2><input type="password" inputmode="numeric" placeholder="Set PIN (empty = no lock)" value="'+esc(C.pin)+'" onchange="C.pin=this.value;sv()"></div>'+
'<div class="card"><h2>Backup</h2><p class="m">Data is stored only on this phone. Copy a backup now and then and keep it in WhatsApp or Notes.</p><textarea id="bt" rows="5" placeholder="Paste backup here to restore"></textarea><div class="r" style="margin-top:8px"><button class="p" onclick="$(\'bt\').value=JSON.stringify(S);$(\'bt\').select();try{navigator.clipboard.writeText($(\'bt\').value)}catch(e){}">Create backup</button><button onclick="rest()">Restore</button></div></div>'}
function logo(el){var fl=el.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);C.logo=c.toDataURL("image/png");sv();draw()};im.src=r.result};r.readAsDataURL(fl)}
function rest(){try{var o=JSON.parse($("bt").value);if(o.items&&o.bills){S=o;C=S.cfg=Object.assign(C,S.cfg||{});sv();alert("Restored");draw()}}catch(e){alert("Invalid backup text")}}
draw();
try{if("serviceWorker"in navigator)navigator.serviceWorker.register("/billing/sw.js",{scope:"/billing/"})}catch(e){}
</script></body></html>
